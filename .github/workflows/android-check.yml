name: Android launch check

# Builds the APK, installs it on an emulator, opens it and reports what the app logs.
# Runs whenever the app code changes.
on:
  push:
    paths: ['.github/workflows/android-check.yml', 'lib/**', 'android/**']
  workflow_dispatch:

jobs:
  launch:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/lib/android/sdk/ndk
          df -h / | tail -1
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter build apk --release && cp build/app/outputs/flutter-apk/app-release.apk SSH.apk && rm -rf build ~/.gradle/caches
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash .github/scripts/android-launch.sh
      - name: Report
        if: always()
        run: |
          sed 's/^/::notice::step /' steps.txt 2>/dev/null || true
          echo "::notice::pid=$(cat pid.txt 2>/dev/null) focus=$(tr '\n' ' ' < focus.txt 2>/dev/null)"
          grep -o 'text="[^"]*"' ui.txt 2>/dev/null | sort -u | head -20 | tr '\n' ' ' | sed 's/^/::notice::ui /'; echo
          cat applog.txt flutter.txt 2>/dev/null | grep -v -E '^-----|chatty' | sort -u | tail -45 | while IFS= read -r l; do echo "::warning::$l"; done
      - name: Full app log
        if: always()
        run: |
          echo "=== applog"; cat applog.txt 2>/dev/null
          echo "=== flutter"; cat flutter.txt 2>/dev/null
          echo "=== ui"; cat ui.txt 2>/dev/null; echo
          echo "=== screen"; gzip -9c screen.png 2>/dev/null | base64 -w0; echo; echo "=== end"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logcat
          path: '*.txt'
